name: Profile assets

# 每天生成主页上的动态图,统一推到 output 分支(每次强推成单个提交,仓库不会越来越大):
#   贪吃蛇 + 3D 贡献图 —— 用 Actions 自带令牌即可
#   语言占比图 —— 需要 LANG_STATS_TOKEN(只读 fine-grained token,能看到私有仓库的元数据);
#                 没配或失效时沿用上一次生成的图,不影响其它图更新
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-assets.yml"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: 3D contributions
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Language card
        env:
          # 两个名字都认:LANG_STATS_TOKEN 是约定名,PROFILE 是当初实际建的名字
          LANG_STATS_TOKEN: ${{ secrets.LANG_STATS_TOKEN || secrets.PROFILE }}
          PREV_STATS: /tmp/prev-stats.json
        run: |
          mkdir -p dist
          git fetch -q --depth 1 origin output && git show FETCH_HEAD:lang-stats.json > "$PREV_STATS" 2>/dev/null || true
          if [ -n "$LANG_STATS_TOKEN" ] && python3 scripts/lang_card.py dist README.md; then
            echo "语言图已按最新数据重新生成"
          else
            echo "::warning::语言图没有重新生成(token 未配置、失效或看不到私有仓库),沿用上一次的图"
            git checkout -q -- README.md
            git archive FETCH_HEAD | tar -x -C dist --wildcards 'lang-*' \
              || echo "::warning::output 分支里还没有语言图"
          fi

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp profile-3d-contrib/profile-green-animate.svg dist/3d-light.svg
          cp profile-3d-contrib/profile-night-view.svg   dist/3d-dark.svg
          # 3D 图自带的语言饼图只算公开仓库、设置里又关不掉:删掉它,在空出来的位置放连续贡献统计
          python3 scripts/post_3d.py "${{ github.repository_owner }}" dist/3d-light.svg dist/3d-dark.svg \
            || echo "::warning::3D 图里没找到饼图(组件结构可能变了),本次保留原图"
          ls -la dist

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 图先发布,README 后更新:避免 README 指向还不存在的新版本图
      - name: Update README numbers
        run: |
          git diff --quiet -- README.md && { echo "README 无变化"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh language stats"
          git pull --rebase -q origin main
          git push -q origin HEAD:main
